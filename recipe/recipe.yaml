context:
  name: supervisor-pydantic
  version: "1.5.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/supervisor-pydantic/supervisor_pydantic-${{ version }}.tar.gz
  sha256: 74fc05c26c74d09db6a756e70f04067a116555ad0e06a70af56e1d56507471e7

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - colorlog
    - hydra-core
    - jinja2
    - omegaconf
    - pydantic >=2
    - python-dateutil
    - rich
    - typer

tests:
  - python:
      imports:
        - supervisor_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Pydantic models for supervisor
  homepage: https://github.com/airflow-laminar/supervisor-pydantic
  repository: https://github.com/airflow-laminar/supervisor-pydantic

extra:
  recipe-maintainers:
    - timkpaine
