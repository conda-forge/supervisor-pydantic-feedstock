context:
  name: supervisor-pydantic
  version: "1.5.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/supervisor-pydantic/supervisor_pydantic-${{ version }}.tar.gz
  sha256: 037daa649c6a58a2d9d15e0b731a4904baa21cf72e4a0cce8b6f9c2796cb3965

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - colorlog
    - hydra-core
    - jinja2
    - omegaconf
    - pydantic >=2
    - rich
    - typer

tests:
  - python:
      imports:
        - supervisor_pydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Pydantic models for supervisor
  homepage: https://github.com/airflow-laminar/supervisor-pydantic
  repository: https://github.com/airflow-laminar/supervisor-pydantic

extra:
  recipe-maintainers:
    - timkpaine
